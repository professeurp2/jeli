name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:

# One deploy at a time; a newer push waits instead of racing the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  deploy:
    # Only a green main reaches production.
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the pushed commit to Railway
        env:
          # Railway project token (Project → Settings → Tokens), stored as a repository secret.
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::warning::RAILWAY_TOKEN secret is not set: skipping the deploy"
            exit 0
          fi
          npx --yes @railway/cli@latest redeploy --service jeli --from-source --yes
